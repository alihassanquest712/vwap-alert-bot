name: VWAP NoWick Alert Bot
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install Dependencies
        run: pip install -r requirements.txt
      - name: Restore Bot State
        uses: actions/cache@v4
        with:
          path: bot_state.json
          key: bot-state-${{ github.run_id }}
          restore-keys: |
            bot-state-
      - name: Run Alert Bot
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          GMAIL_SENDER:    ${{ secrets.GMAIL_SENDER }}
          GMAIL_APP_PASS:  ${{ secrets.GMAIL_APP_PASS }}
          GMAIL_RECEIVER:  ${{ secrets.GMAIL_RECEIVER }}
        run: python bot_cloud.py
      - name: Save Bot State
        uses: actions/cache@v4
        with:
          path: bot_state.json
          key: bot-state-${{ github.run_id }}
