name: VWAP NoWick 24/7 Bot

on:
  schedule:
    # Backup restart trigger har 4 ghante baad
    - cron: '0 */4 * * *'
  workflow_dispatch:
    inputs:
      test_alert:
        description: 'Check to send LIVE Test Alert to Discord, Gmail & ntfy'
        required: false
        default: false
        type: boolean

concurrency:
  group: vwap-bot-runner
  cancel-in-progress: true

permissions:
  actions: write
  contents: read

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 360  # Continuous runner (max 6 hours per cycle)

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Restore Bot State
        uses: actions/cache@v4
        with:
          path: bot_state.json
          key: bot-state-${{ github.run_id }}
          restore-keys: |
            bot-state-

      - name: Run 24/7 Continuous Alert Bot
        env:
          GITHUB_TOKEN:       ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY:  ${{ github.repository }}
          MAX_RUNTIME_SECONDS: 19800
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK:    ${{ secrets.DISCORD_WEBHOOK }}
          GMAIL_SENDER:       ${{ secrets.GMAIL_SENDER }}
          GMAIL_APP_PASS:     ${{ secrets.GMAIL_APP_PASS }}
          GMAIL_RECEIVER:     ${{ secrets.GMAIL_RECEIVER }}
          NTFY_TOPIC:         ${{ secrets.NTFY_TOPIC }}
        run: |
          if [ "${{ inputs.test_alert }}" = "true" ]; then
            python bot_cloud.py --test
          else
            python bot_cloud.py
          fi

      - name: Save Bot State
        if: always()
        uses: actions/cache@v4
        with:
          path: bot_state.json
          key: bot-state-${{ github.run_id }}
